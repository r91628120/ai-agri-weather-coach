openapi: 3.1.0
info:
  title: AIAKOS Satellite Service Enterprise API
  version: 1.0.0
  description: Sentinel-2 L2A NDVI 統計與 AIAKOS 衛星服務預留介面。
servers:
  - url: http://127.0.0.1:8787
    description: Local Wrangler
paths:
  /api/v1/health:
    get:
      summary: Worker 健康檢查
      responses:
        "200":
          description: Worker online
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/v1/cdse/status:
    get:
      summary: CDSE OAuth 與 Token Cache 狀態
      responses:
        "200":
          description: CDSE connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/ndvi/statistics:
    post:
      summary: 取得農地 Sentinel-2 L2A NDVI 統計
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NdviStatisticsRequest"
      responses:
        "200":
          description: NDVI statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NdviStatisticsData"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "415":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        "504":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/ndvi/image:
    post:
      summary: 預留 NDVI 影像端點
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/satellite/search:
    post:
      summary: 依農地範圍搜尋 CDSE Sentinel-2 L2A 觀測資料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SatelliteSearchRequest"
      responses:
        "200": { description: 觀測清單與建議觀測 }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "413": { $ref: "#/components/responses/ErrorResponse" }
        "415": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
        "504": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/ndvi/history:
    get:
      summary: 預留 NDVI 歷史端點
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/ai/analyze:
    post:
      summary: 預留 AI 判讀端點
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
components:
  schemas:
    Geometry:
      oneOf:
        - type: object
          required: [type, coordinates]
          properties:
            type:
              const: Polygon
            coordinates:
              type: array
              minItems: 1
              items:
                type: array
                minItems: 4
                items:
                  type: array
                  prefixItems:
                    - type: number
                      minimum: -180
                      maximum: 180
                    - type: number
                      minimum: -90
                      maximum: 90
        - type: object
          required: [type, coordinates]
          properties:
            type:
              const: MultiPolygon
            coordinates:
              type: array
              minItems: 1
    NdviStatisticsRequest:
      type: object
      required: [geometry, dateFrom, dateTo]
      additionalProperties: true
      properties:
        fieldId:
          type: string
          maxLength: 200
        fieldName:
          type: string
          maxLength: 200
        geometry:
          $ref: "#/components/schemas/Geometry"
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        maxCloudCoverage:
          type: number
          default: 30
          minimum: 0
          maximum: 100
    SatelliteSearchRequest:
      allOf:
        - $ref: "#/components/schemas/NdviStatisticsRequest"
        - type: object
          properties:
            limit:
              type: integer
              default: 10
              minimum: 1
              maximum: 50
    Observation:
      type: object
      properties:
        intervalFrom:
          type: [string, "null"]
          format: date-time
        intervalTo:
          type: [string, "null"]
          format: date-time
        ndvi:
          type: object
          properties:
            mean: { type: [number, "null"] }
            min: { type: [number, "null"] }
            max: { type: [number, "null"] }
            stDev: { type: [number, "null"] }
        sampleCount: { type: number }
        noDataCount: { type: number }
        validPixelRatio:
          type: number
          minimum: 0
          maximum: 1
    NdviStatisticsData:
      type: object
      properties:
        fieldId: { type: [string, "null"] }
        fieldName: { type: [string, "null"] }
        provider: { const: Copernicus Data Space Ecosystem }
        collection: { const: Sentinel-2 L2A }
        resolutionMeters: { const: 10 }
        requestedRange:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        latestObservation:
          oneOf:
            - $ref: "#/components/schemas/Observation"
            - type: "null"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/Observation"
    SuccessResponse:
      type: object
      required: [success, requestId, timestamp, data]
      properties:
        success: { const: true }
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
        data: { type: object }
    ErrorResponse:
      type: object
      required: [success, requestId, timestamp, error]
      properties:
        success: { const: false }
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
  responses:
    ErrorResponse:
      description: AIAKOS 統一錯誤格式
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: Reserved for a future release
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            requestId: 00000000-0000-0000-0000-000000000000
            timestamp: 2026-07-19T00:00:00.000Z
            error:
              code: NOT_IMPLEMENTED
              message: This endpoint is reserved for a future AIAKOS Satellite Service release.
              details: null
